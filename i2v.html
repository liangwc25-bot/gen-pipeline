<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>🎬 图转视频 · I2V</title>
<style>
:root {
  --bg: #0f0f14; --card: #1a1a24; --accent: #7c5cfc;
  --green: #4ade80; --red: #f87171; --text: #e2e8f0; --text2: #94a3b8;
  --radius: 12px;
}
[data-theme="light"] {
  --bg: #f8f9fc; --card: #fff; --accent: #6c4ce0;
  --green: #16a34a; --red: #dc2626; --text: #1e293b; --text2: #64748b;
}
[data-theme="light"] .card { border-color: rgba(0,0,0,0.08); }
[data-theme="light"] textarea, [data-theme="light"] input[type="text"], [data-theme="light"] select,
[data-theme="light"] input[type="number"], [data-theme="light"] input[type="file"] {
  border-color: rgba(0,0,0,0.12) !important; background: #fff !important;
}
[data-theme="light"] .lora-dropdown, [data-theme="light"] #motion-presets-dd, [data-theme="light"] .snippet-editor {
  border-color: rgba(0,0,0,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
[data-theme="light"] .snippet-btn, [data-theme="light"] .submit-btn, [data-theme="light"] .lora-remove {
  color: var(--text2);
}
[data-theme="light"] #motion-presets-dd, [data-theme="light"] .lora-dropdown { background: #fff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 20px;
  max-width: 600px; margin: 0 auto;
}
h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.card {
  background: var(--card); border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.source-section { display: flex; align-items: center; gap: 12px; }
.source-section img {
  width: 120px; height: 120px; object-fit: cover;
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  background: var(--bg);
}
.source-info { flex: 1; min-width: 0; }
.source-name { font-size: 0.82rem; color: var(--text2); word-break: break-all; margin-bottom: 6px; }
.upload-btn {
  background: none; border: 1px solid var(--accent); color: var(--accent);
  border-radius: 8px; padding: 6px 14px; font-size: 0.82rem; cursor: pointer;
  transition: .15s;
}
.upload-btn:hover { background: rgba(124,92,252,0.1); }
.file-input { display: none; }

label.section-label {
  display: block; font-size: 0.78rem; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
}
textarea, input[type="text"], select {
  width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: var(--text); padding: 10px 12px;
  font-size: 0.9rem; font-family: inherit;
}
textarea:focus, input:focus, select:focus {
  outline: none; border-color: var(--accent);
}
textarea { resize: vertical; min-height: 180px; }
.params-row {
  display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;
}
.param-item { flex: 1; min-width: 80px; }
.param-item label { display: block; font-size: 0.75rem; color: var(--text2); margin-bottom: 4px; }
.param-item input, .param-item select { padding: 8px 10px; font-size: 0.85rem; }
.lora-row { margin-top: 10px; display: flex; gap: 8px; align-items: flex-end; }
.lora-row input[type="text"] { flex: 1; }
.lora-row input.has-value { color: var(--accent); font-weight: 600; border-color: rgba(255,255,255,0.25); }
.lora-remove {
  width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  background: rgba(255,255,255,0.04); color: var(--text2); font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: .2s; align-self: flex-end;
}
.lora-remove:hover { border-color: var(--red); color: var(--red); background: rgba(255,77,79,0.08); }

.submit-btn {
  width: 100%; background: var(--accent); border: none;
  border-radius: var(--radius); color: #fff; padding: 14px;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  transition: .15s; margin-top: 16px;
}
.submit-btn:hover { opacity: 0.85; }
.submit-btn:disabled { opacity: 0.5; pointer-events: none; }

.status-box {
  margin-top: 12px; padding: 12px; border-radius: 8px;
  font-size: 0.85rem;
  background: rgba(124,92,252,0.08); border: 1px solid rgba(124,92,252,0.2);
  display: none;
}
.status-box.show { display: block; }
.status-box.success { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.3); }
.status-box.error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); }

.result-section { display: none; margin-top: 16px; }
.result-section.show { display: block; }
.result-section video {
  width: 100%; max-height: 60vh; border-radius: var(--radius);
  background: #000;
}
.result-actions { display: flex; gap: 8px; margin-top: 10px; }
.result-actions button {
  flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: var(--text); padding: 8px; font-size: 0.85rem;
  cursor: pointer; transition: .15s;
}
.result-actions button:hover { border-color: var(--accent); }

.job-list { margin-top: 20px; }
.job-list h3 { font-size: 0.9rem; color: var(--text2); margin-bottom: 8px; }
.job-item {
  background: var(--card); border-radius: 8px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px;
  font-size: 0.82rem;
}
.job-item .job-prompt { color: var(--text); margin-bottom: 4px; }
.job-item .job-meta { color: var(--text2); font-size: 0.75rem; display: flex; gap: 12px; }
.job-item .job-status { font-weight: 600; }
.job-item .job-status.done { color: var(--green); }
.job-item .job-status.running { color: var(--accent); }
.job-item .job-status.failed { color: var(--red); }

.lora-dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0;
  background: var(--card); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 100;
  margin-top: 2px;
}
.lora-dropdown.show { display: block; }
.lora-dropdown .lora-opt {
  padding: 8px 12px; font-size: 0.82rem; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: .1s;
}
.lora-dropdown .lora-opt:hover, .lora-dropdown .lora-opt.active {
  background: rgba(124,92,252,0.15); color: var(--accent);
}
.lora-dropdown .lora-opt.clear { color: var(--text2); font-style: italic; }
.lora-dropdown .lora-opt.custom { color: var(--accent); }
.noise-badge {
  display: inline-block; font-size: 0.62rem; font-weight: 700;
  padding: 1px 6px; border-radius: 5px; margin-right: 4px;
  vertical-align: 1px; letter-spacing: 0.3px;
}
.noise-badge.n-high { background: rgba(66,133,244,0.18); color: #7db3ff; border: 1px solid rgba(66,133,244,0.4); }
.noise-badge.n-low  { background: rgba(251,188,5,0.16); color: #f5cd57; border: 1px solid rgba(251,188,5,0.4); }
.noise-badge.n-both { background: rgba(168,85,247,0.18); color: #c9a6f5; border: 1px solid rgba(168,85,247,0.45); }

/* ── Snippet editor modal ── */
.snippet-editor-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.snippet-editor-overlay.open { display: flex; }
.snippet-editor {
  background: var(--card); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
  width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto; padding: 20px;
}
.snippet-editor h3 { margin: 0 0 16px; font-size: 1rem; }
.snippet-editor .se-group { margin-bottom: 18px; }
.snippet-editor .se-group-label { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.snippet-editor .se-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(255,255,255,0.02); }
.snippet-editor .se-row input, .snippet-editor .se-row textarea {
  width: 100%; font-size: 0.82rem; padding: 8px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text);
}
.snippet-editor .se-row textarea { min-height: 70px; resize: vertical; line-height: 1.4; }
.snippet-editor .se-del {
  align-self: flex-end; background: none; border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; color: var(--text2); width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem;
}
.snippet-editor .se-del:hover { border-color: var(--red); color: var(--red); }
.snippet-editor .se-add button {
  width: 100%; padding: 8px; background: rgba(124,92,252,0.12); color: var(--accent);
  border: 1px dashed rgba(124,92,252,0.4); border-radius: 8px; cursor: pointer; font-size: 0.82rem;
}
.snippet-editor .se-add button:hover { background: rgba(124,92,252,0.2); }
.snippet-editor-actions { display: flex; gap: 10px; margin-top: 8px; }
.snippet-editor-actions button {
  flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; border: none;
}
.snippet-editor-actions .se-done { background: var(--accent); color: #fff; }
.snippet-editor-actions .se-cancel { background: rgba(255,255,255,0.08); color: var(--text); }

/* 动作预设下拉: 默认隐藏, .open 显示 (class 控制, 避免 display 切换边界问题) */
#motion-presets-dd { display: none; }
#motion-presets-dd.open { display: block; }

@media (max-width: 480px) {
  body { padding: 12px; }
  .source-section { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<button id="theme-toggle" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(128,128,128,0.3);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer;z-index:9999;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,0.15)" onclick="toggleTheme()" title="切换主题">☀️</button>

<h1>🎬 图转视频</h1>

<!-- Source -->
<div class="card">
  <label class="section-label">源图</label>
  <div class="source-section">
    <img id="sourceImg" src="" alt="未选择">
    <div class="source-info">
      <div class="source-name" id="sourceName">未选择图片</div>
      <input type="file" id="sourceFile" class="file-input" accept="image/*,.png,.jpg,.jpeg,.webp">
      <button class="upload-btn" onclick="document.getElementById('sourceFile').click()">📁 选图</button>
    </div>
  </div>
</div>

<!-- Prompt -->
<div class="card">
  <label class="section-label">动作描述 <span style="position:relative;display:inline"><button class="snippet-btn" onclick="toggleMotionPresets(event)" style="font-size:0.7rem;padding:2px 6px;margin-left:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text2);cursor:pointer">📌 预设</button><div class="snippet-dropdown" id="motion-presets-dd" style="position:absolute;z-index:200;background:var(--card);border:1px solid rgba(255,255,255,0.12);border-radius:10px;min-width:280px;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.5);padding:4px 0;top:100%;left:0"></div></span></label>
  <textarea id="prompt" placeholder="英文动作描述: She slowly turns, gentle breathing, soft breeze through hair..."></textarea>
</div>

<!-- Params -->
<div class="card">
  <label class="section-label">参数</label>
  <div class="params-row">
    <div class="param-item" style="flex:2;">
      <label>引擎 (Provider)</label>
      <select id="provider" onchange="onProviderChange()">
        <option value="replicate-wan">Replicate Wan 2.2 (1 LoRA)</option>
        <option value="runpod-wan">RunPod Wan 2.2 (多 LoRA)</option>
      </select>
    </div>
  </div>
  <div class="params-row" id="replicateParams">
    <div class="param-item">
      <label>帧数</label>
      <input type="number" id="frames" value="121" min="81" max="121">
    </div>
    <div class="param-item">
      <label>fps</label>
      <input type="number" id="fps" value="24" min="5" max="30">
    </div>
    <div class="param-item">
      <label>分辨率</label>
      <select id="res">
        <option value="480p" selected>480p</option>
        <option value="720p">720p</option>
      </select>
    </div>
  </div>
  <div class="params-row" id="runpodParams" style="display:none;">
    <div class="param-item">
      <label>宽</label>
      <input type="number" id="rpWidth" value="768" min="256" max="1280">
    </div>
    <div class="param-item">
      <label>高</label>
      <input type="number" id="rpHeight" value="1024" min="256" max="1280">
    </div>
    <div class="param-item">
      <label>Steps</label>
      <input type="number" id="rpSteps" value="10" min="4" max="30">
    </div>
  </div>
  <div class="lora-label-row" style="font-size:0.8rem;color:var(--text2);margin:10px 0 6px;display:flex;justify-content:space-between;">
    <span>自定义 LoRA（每组 High + Low，最多 4 组）</span><span id="lora-pair-count">0 组</span>
  </div>
  <div id="lora-pair-rows"></div>
  <button class="lora-add" id="lora-pair-add-btn" onclick="addLoraPairRow()" style="display:inline-block;margin-top:6px;padding:6px 14px;border:1px dashed rgba(255,255,255,0.15);border-radius:8px;background:transparent;color:var(--text2);font-size:0.8rem;cursor:pointer;">+ 添加 LoRA 组</button>
</div>

<button class="submit-btn" id="submitBtn" onclick="submitI2V()">▶ 生成视频</button>

<!-- Status -->
<div class="status-box" id="statusBox"></div>

<!-- Result -->
<div class="result-section" id="resultSection">
  <video id="resultVideo" controls playsinline></video>
  <div class="result-actions">
    <button onclick="navigator.clipboard.writeText(document.getElementById('resultVideo').src)">📋 复制地址</button>
    <button onclick="window.open(document.getElementById('resultVideo').src, '_blank')">🔗 新窗口打开</button>
  </div>
</div>

<!-- Job History -->
<div class="job-list" id="jobList"></div>

<script>
// ── Init from URL params ──
const params = new URLSearchParams(location.search);
const sourceFilename = params.get('source');
let currentJobId = null;
let currentJobPoll = null;
let currentSourceFile = null;  // for uploaded files

// ── LoRA Registry ──
let loraRegistry = [];

function onProviderChange() {
  const p = document.getElementById('provider').value;
  const rp = document.getElementById('runpodParams');
  const repParams = document.getElementById('replicateParams');
  if (rp) rp.style.display = (p === 'runpod-wan') ? 'flex' : 'none';
  if (repParams) repParams.style.display = (p === 'replicate-wan') ? 'flex' : 'none';
}

async function loadLoraRegistry() {
  try {
    const res = await fetch('/api/i2v-loras');
    const data = await res.json();
    loraRegistry = data.loras || [];
  } catch(e) {
    loraRegistry = [];
  }
}
loadLoraRegistry();

function showLoraDropdown() {
  // legacy no-op — dynamic pair rows handle dropdowns per-row
}
function addLoraPairRow(preHighId, preLowId) {
  if (document.querySelectorAll('#lora-pair-rows .lora-pair').length >= 4) return;
  const container = document.getElementById('lora-pair-rows');
  const pair = document.createElement('div');
  pair.className = 'lora-pair';
  pair.style.cssText = 'border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px;margin-bottom:10px;position:relative;';
  pair.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
      '<span style="font-size:0.75rem;color:var(--text2);">LoRA 组 ' + (document.querySelectorAll('#lora-pair-rows .lora-pair').length + 1) + '</span>' +
      '<button class="lora-remove" onclick="removeLoraPair(this)" title="移除整组" style="width:26px;height:26px;">×</button>' +
    '</div>' +
    buildLoraLine('high') +
    buildLoraLine('low') ;
  container.appendChild(pair);
  if (preHighId) setPairLora(pair, 'high', preHighId);
  if (preLowId) setPairLora(pair, 'low', preLowId);
  updateLoraPairCount();
}

function buildLoraLine(slot) {
  return '<div class="lora-row" data-slot="' + slot + '" style="gap:6px;align-items:center;">' +
    '<div style="flex:1;position:relative;">' +
      '<label style="display:block;font-size:0.7rem;color:var(--text2);margin-bottom:2px;">' + (slot==='high'?'High 噪声':'Low 噪声') + '</label>' +
      '<input type="text" class="lora-search" placeholder="搜索 LoRA…" autocomplete="off" style="width:100%;"' +
        ' onfocus="filterPairDropdown(this)" oninput="filterPairDropdown(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();selectFirstPairOpt(this)}">' +
      '<div class="lora-dropdown"></div>' +
      '<input type="hidden" class="lora-value">' +
    '</div>' +
    '<div style="max-width:70px;">' +
      '<label style="display:block;font-size:0.7rem;color:var(--text2);margin-bottom:2px;">Scale</label>' +
      '<input type="number" class="lora-scale" value="1.0" min="0.1" max="2.0" step="0.1">' +
    '</div>' +
  '</div>';
}

function setPairLora(pair, slot, id) {
  const lora = loraRegistry.find(function(l){ return l.id === id; });
  if (!lora) return;
  const row = pair.querySelector('.lora-row[data-slot="'+slot+'"]');
  row.querySelector('.lora-value').value = slot==='high' ? (lora.url||'') : (lora.url_2||lora.url||'');
  const search = row.querySelector('.lora-search');
  search.value = lora.name;
  search.classList.add('has-value');
  row.querySelector('.lora-scale').value = lora.default_scale || 1.0;
}

function filterPairDropdown(input) {
  const row = input.closest('.lora-row');
  const dd = row.querySelector('.lora-dropdown');
  const q = (input.value||'').toLowerCase().trim();
  let items = loraRegistry;
  if (q) items = loraRegistry.filter(function(l){ return l.name.toLowerCase().indexOf(q)>=0 || (l.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q)>=0; }); });
  let html = '<div class="lora-opt clear" onclick="clearPairLora(this)">— 不启用 —</div>';
  items.forEach(function(l){ html += '<div class="lora-opt" onclick="pickPairLora(this,\'' + escapeHtml(l.id) + '\')"><div>' + noiseBadge(l) + ' ' + escapeHtml(l.name) + '</div></div>'; });
  if (q && items.length===0) html += '<div class="lora-opt custom" onclick="customPairLora(this)">✏️ 手动输入 URL: "' + escapeHtml(q) + '"</div>';
  else html += '<div class="lora-opt custom" onclick="customPairLora(this)">✏️ 手动输入 URL…</div>';
  dd.innerHTML = html; dd.classList.add('show');
}

function pickPairLora(el, id) {
  const row = el.closest('.lora-row');
  const lora = loraRegistry.find(function(l){ return l.id === id; });
  if (!lora) return;
  const slot = row.dataset.slot;
  row.querySelector('.lora-value').value = slot==='high' ? (lora.url||'') : (lora.url_2||lora.url||'');
  const search = row.querySelector('.lora-search');
  search.value = lora.name;
  search.classList.add('has-value');
  row.querySelector('.lora-scale').value = lora.default_scale || 1.0;
  row.querySelector('.lora-dropdown').classList.remove('show');
}

function clearPairLora(el) {
  const row = el.closest('.lora-row');
  row.querySelector('.lora-value').value = '';
  const search = row.querySelector('.lora-search');
  search.value = ''; search.classList.remove('has-value');
  row.querySelector('.lora-dropdown').classList.remove('show');
}

function customPairLora(el) {
  const row = el.closest('.lora-row');
  const q = row.querySelector('.lora-search').value.trim();
  const url = prompt('输入 LoRA .safetensors URL:', q || '');
  if (!url) return;
  row.querySelector('.lora-value').value = url;
  const search = row.querySelector('.lora-search');
  search.value = ''; search.classList.add('has-value');
  row.querySelector('.lora-dropdown').classList.remove('show');
}

function selectFirstPairOpt(input) {
  const opts = input.closest('.lora-row').querySelectorAll('.lora-opt');
  if (opts.length > 1) opts[1].click(); else if (opts.length > 0) opts[0].click();
}

function removeLoraPair(btn) {
  btn.closest('.lora-pair').remove();
  updateLoraPairCount();
  // renumber
  const pairs = document.querySelectorAll('#lora-pair-rows .lora-pair');
  pairs.forEach(function(p,i){ const lbl=p.querySelector('span'); if(lbl) lbl.textContent='LoRA 组 '+(i+1); });
}

function updateLoraPairCount() {
  const n = document.querySelectorAll('#lora-pair-rows .lora-pair').length;
  const el = document.getElementById('lora-pair-count');
  if (el) el.textContent = n + ' 组';
  const addBtn = document.getElementById('lora-pair-add-btn');
  if (addBtn) addBtn.style.display = n >= 4 ? 'none' : 'inline-block';
}

function collectLoraPairs() {
  const pairs = [];
  document.querySelectorAll('#lora-pair-rows .lora-pair').forEach(function(pair){
    const hiRow = pair.querySelector('.lora-row[data-slot="high"]');
    const loRow = pair.querySelector('.lora-row[data-slot="low"]');
    const hiUrl = hiRow ? hiRow.querySelector('.lora-value').value.trim() : '';
    const loUrl = loRow ? loRow.querySelector('.lora-value').value.trim() : '';
    const hiScale = hiRow ? parseFloat(hiRow.querySelector('.lora-scale').value)||1.0 : 1.0;
    const loScale = loRow ? parseFloat(loRow.querySelector('.lora-scale').value)||1.0 : 1.0;
    if (hiUrl || loUrl) pairs.push({ high: hiUrl, high_scale: hiScale, low: loUrl, low_scale: loScale });
  });
  return pairs;
}

// ── Restore pending jobs from localStorage ──
restoreJobs();

function restoreJobs() {
  const jobs = loadJobs();
  const pending = jobs.filter(j => j.status === 'running');
  if (pending.length > 0) {
    const job = pending[0];
    document.getElementById('prompt').value = job.prompt || '';
    document.getElementById('frames').value = job.frames || 121;
    document.getElementById('fps').value = job.fps || 24;
    document.getElementById('res').value = job.resolution || '480p';
    // rebuild lora pairs if any
    const rows = document.getElementById('lora-pair-rows');
    if (rows) {
      rows.innerHTML = '';
      const pairs = job.loraPairs || [];
      if (pairs.length === 0) { addLoraPairRow(); }
      else {
        pairs.forEach(function(p){
          addLoraPairRow();
          const pairEls = rows.querySelectorAll('.lora-pair');
          const last = pairEls[pairEls.length-1];
          if (last) {
            const hi = last.querySelector('.lora-row[data-slot="high"]');
            const lo = last.querySelector('.lora-row[data-slot="low"]');
            if (hi && p.high) { hi.querySelector('.lora-value').value = p.high; const s=hi.querySelector('.lora-search'); s.value='(high)'; s.classList.add('has-value'); hi.querySelector('.lora-scale').value = p.high_scale||1.0; }
            if (lo && p.low) { lo.querySelector('.lora-value').value = p.low; const s=lo.querySelector('.lora-search'); s.value='(low)'; s.classList.add('has-value'); lo.querySelector('.lora-scale').value = p.low_scale||1.0; }
          }
        });
      }
    }
    if (job.source) {
      currentSourceFile = job.source;
      document.getElementById('sourceName').textContent = job.source;
      document.getElementById('sourceImg').src = `/raw/${encodeURIComponent(job.source)}`;
    }
    currentJobId = job.jobId;
    showStatus(`⏳ 恢复之前的任务…`, '');
    pollJob(job.jobId);
  }
  renderJobHistory();
}

function loadJobs() {
  try { return JSON.parse(localStorage.getItem('i2v_jobs') || '[]'); }
  catch(e) { return []; }
}

function saveJob(job) {
  const jobs = loadJobs();
  const idx = jobs.findIndex(j => j.jobId === job.jobId);
  if (idx >= 0) jobs[idx] = job;
  else jobs.unshift(job);
  if (jobs.length > 20) jobs.length = 20;
  localStorage.setItem('i2v_jobs', JSON.stringify(jobs));
}

// ── Submit ──
async function submitI2V() {
  if (!currentSourceFile) {
    showStatus('⚠ 请先选择源图', 'error');
    return;
  }
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) {
    showStatus('⚠ 请填写动作描述', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 提交中…';
  document.getElementById('statusBox').classList.remove('success', 'error', 'show');

  const frames = parseInt(document.getElementById('frames').value) || 121;
  const fps = parseInt(document.getElementById('fps').value) || 24;
  const resolution = document.getElementById('res').value;
  const loraPairs = collectLoraPairs();
  const provider = document.getElementById('provider').value;

  try {
    let filename = currentSourceFile;

    // If it's a File object (uploaded), we need to send it differently
    if (currentSourceFile instanceof File) {
      // Upload the file first via a simple endpoint, or use data URL
      // For now: use the existing approach — POST with filename that we'll handle server-side
      // Actually, let's use a different approach: create a temp upload endpoint
      const formData = new FormData();
      formData.append('file', currentSourceFile);
      
      const uploadRes = await fetch('/api/upload-source', {
        method: 'POST',
        body: formData,
      });
      const uploadData = await uploadRes.json();
      if (!uploadData.success) {
        showStatus('❌ 上传失败: ' + (uploadData.error || 'unknown'), 'error');
        btn.disabled = false;
        btn.textContent = '▶ 重试';
        return;
      }
      filename = uploadData.filename;
    }

    const body = {
      filename: filename,
      prompt: prompt,
      provider: provider,
    };
    if (provider === 'runpod-wan') {
      body.width = parseInt(document.getElementById('rpWidth').value) || 768;
      body.height = parseInt(document.getElementById('rpHeight').value) || 1024;
      body.steps = parseInt(document.getElementById('rpSteps').value) || 10;
      body.length = frames;
      body.seed = Math.floor(Math.random() * 1000000);
    } else {
      body.num_frames = frames;
      body.fps = fps;
      body.resolution = resolution;
    }
    if (loraPairs.length) {
      body.lora_pairs = loraPairs;
    }

    const res = await fetch('/api/i2v', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.success || !data.job_id) {
      showStatus('❌ 提交失败: ' + (data.error || 'unknown'), 'error');
      btn.disabled = false;
      btn.textContent = '▶ 重试';
      return;
    }

    currentJobId = data.job_id;
    btn.textContent = '⏳ 生成中…';

    // Save job to localStorage
    const sourceName = currentSourceFile instanceof File ? currentSourceFile.name : currentSourceFile;
    saveJob({
      jobId: data.job_id,
      status: 'running',
      prompt: prompt,
      source: typeof currentSourceFile === 'string' ? currentSourceFile : null,
      sourceName: sourceName,
      frames: frames,
      fps: fps,
      resolution: resolution,
      loraPairs: loraPairs,
      startedAt: Date.now(),
    });
    renderJobHistory();

    // Start polling
    showStatus('提交成功，等待 Replicate…', '');
    pollJob(data.job_id);

  } catch(e) {
    showStatus('❌ 网络错误: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '▶ 重试';
  }
}

function showStatus(msg, cls) {
  const box = document.getElementById('statusBox');
  box.textContent = msg;
  box.className = 'status-box show ' + cls;
}

// ── Poll ──
function pollJob(jobId) {
  if (currentJobPoll) clearTimeout(currentJobPoll);
  
  const poll = async () => {
    try {
      const res = await fetch(`/api/job?job=${encodeURIComponent(jobId)}`);
      const data = await res.json();
      const btn = document.getElementById('submitBtn');
      
      if (data.status === 'done') {
        currentJobPoll = null;
        const result = data.result;
        if (result.success) {
          showStatus(`✅ 完成！(${result.elapsed_s}s)`, 'success');
          btn.textContent = '▶ 再来一次';
          btn.disabled = false;
          // Show video
          const video = document.getElementById('resultVideo');
          video.src = `/raw/${encodeURIComponent(result.filename)}`;
          video.load();
          document.getElementById('resultSection').classList.add('show');
          // Update job
          updateJob(jobId, {status: 'done', result: result, endedAt: Date.now()});
        } else {
          showStatus('❌ ' + (result.error || '失败'), 'error');
          btn.textContent = '▶ 重试';
          btn.disabled = false;
          updateJob(jobId, {status: 'failed', error: result.error, endedAt: Date.now()});
        }
        renderJobHistory();
        return;
      }

      // Still running
      const elapsed = Math.floor((Date.now() - getJobStartTime(jobId)) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      showStatus(`⏳ 生成中… ${mins > 0 ? mins + '分' : ''}${secs}秒`, '');
      currentJobPoll = setTimeout(poll, 3000);
      
    } catch(e) {
      currentJobPoll = setTimeout(poll, 5000);
    }
  };
  
  currentJobPoll = setTimeout(poll, 3000);
}

function getJobStartTime(jobId) {
  const jobs = loadJobs();
  const j = jobs.find(j => j.jobId === jobId);
  return j ? j.startedAt : Date.now();
}

function updateJob(jobId, updates) {
  const jobs = loadJobs();
  const j = jobs.find(j => j.jobId === jobId);
  if (j) Object.assign(j, updates);
  localStorage.setItem('i2v_jobs', JSON.stringify(jobs));
}

function renderJobHistory() {
  const jobs = loadJobs();
  if (jobs.length === 0) {
    document.getElementById('jobList').innerHTML = '';
    return;
  }
  let html = '<h3>📋 历史</h3>';
  for (const j of jobs) {
    const statusCls = j.status === 'done' ? 'done' : j.status === 'failed' ? 'failed' : 'running';
    const statusText = j.status === 'done' ? '✅ 完成' : j.status === 'failed' ? '❌ 失败' : '⏳ 运行中';
    const elapsed = j.endedAt ? Math.floor((j.endedAt - j.startedAt) / 1000) + 's' : '';
    html += `<div class="job-item">
      <div class="job-prompt">${escapeHtml(j.prompt?.substring(0, 80) || '')}</div>
      <div class="job-meta">
        <span>${j.frames}f @ ${j.fps}fps · ${j.resolution}</span>
        <span class="job-status ${statusCls}">${statusText}</span>
        ${elapsed ? `<span>${elapsed}</span>` : ''}
      </div>
      ${j.status === 'done' ? `<div class="job-meta" style="margin-top:4px;"><a href="/" style="color:var(--accent);text-decoration:none;font-size:0.75rem;">→ 在图库中查看</a></div>` : ''}
    </div>`;
  }
  document.getElementById('jobList').innerHTML = html;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ── Keyboard shortcut ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.ctrlKey) {
    submitI2V();
  }
});

async function loadI2VSnippets() {
  try {
    const res = await fetch('/api/i2v-snippets');
    const data = await res.json();
    i2vSnippets = data.snippets || {};
  } catch(e) { i2vSnippets = {}; }
  if (!i2vSnippets['✏️ 自定义']) {
    i2vSnippets = { '✏️ 自定义': [], ...i2vSnippets };
  }
}
async function saveI2VSnippets() {
  try {
    await fetch('/api/i2v-snippets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ snippets: i2vSnippets }),
    });
  } catch(e) { /* silent */ }
}
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function toggleMotionPresets(e) {
  e.stopPropagation();
  const dd = document.getElementById('motion-presets-dd');
  // 防抖: 如果刚因选中预设而关闭(<300ms), 忽略这次点击(避免 phantom 二次 click 重新打开)
  if (Date.now() - (window.__presetClosedAt || 0) < 300) return;
  // 用 .open class 控制显示
  if (dd.classList.contains('open')) { dd.classList.remove('open'); return; }
  let html = '<div style="padding:4px 12px;font-size:0.7rem;color:var(--text2);font-weight:700">选择一个预设动作…</div>';
  for (const [group, items] of Object.entries(i2vSnippets)) {
    if (!items || items.length === 0) continue;
    html += `<div style="padding:4px 12px;font-size:0.68rem;color:var(--accent);font-weight:700;margin-top:2px">${escHtml(group)}</div>`;
    items.forEach((p) => {
      html += `<div class="snippet-item" data-snippet-text="${escHtml(p.text)}" style="padding:6px 12px;cursor:pointer;font-size:0.8rem;color:var(--text);transition:.12s" onmouseover="this.style.background='rgba(124,92,252,0.12)'" onmouseout="this.style.background='none'"><div style="font-weight:500">${escHtml(p.label)}</div><div style="font-size:0.72rem;color:var(--text2);margin-top:1px">${escHtml(p.text)}</div></div>`;
    });
  }
  html += `<div onclick="openSnippetEditor(); return false;" style="padding:8px 12px;cursor:pointer;font-size:0.78rem;color:var(--accent);border-top:1px solid rgba(255,255,255,0.1);margin-top:4px" onmouseover="this.style.background='rgba(124,92,252,0.12)'" onmouseout="this.style.background='none'">✏️ 编辑预设…</div>`;
  dd.innerHTML = html;
  dd.classList.add('open');
}
// 事件委托: 点击 .snippet-item → 插入 + 关闭所有 open 的下拉 (照 T2I)
document.addEventListener('click', function(e) {
  const item = e.target.closest('.snippet-item');
  if (item) {
    insertMotionPreset(item);
  }
});
function insertMotionPreset(el) {
  // 在 cursor 位置粘贴(不整段替换)
  const ta = document.getElementById('prompt');
  const text = el.dataset.snippetText || el.dataset.text;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(end);
  const sep = before.length > 0 && !before.endsWith(',') && !before.endsWith(' ') ? ', ' : '';
  ta.value = before + sep + text + ' ' + after;
  const pos = (before + sep + text + ' ').length;
  try { ta.setSelectionRange(pos, pos); } catch(e2) {}
  ta.focus();
  // 关闭所有 open 的下拉 (照 T2I 的可靠机制)
  document.querySelectorAll('.snippet-dropdown.open').forEach(d => d.classList.remove('open'));
  // 记录关闭时间, 供 toggleMotionPresets 防抖忽略 phantom 二次 click
  window.__presetClosedAt = Date.now();
}
// 点击下拉外/按钮外时关闭
document.addEventListener('click', function(e) {
  if (!e.target.closest('#motion-presets-dd') && !e.target.closest('.snippet-btn') && !e.target.closest('#snippet-editor-overlay')) {
    document.getElementById('motion-presets-dd').classList.remove('open');
  }
});

// ── Editor modal ──
let _editorSnapshot = null;
function openSnippetEditor(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  _editorSnapshot = JSON.parse(JSON.stringify(i2vSnippets));
  document.getElementById('motion-presets-dd').classList.remove('open');
  const container = document.getElementById('snippet-editor-groups');
  let html = '';
  for (const [group, items] of Object.entries(i2vSnippets)) {
    html += `<div class="se-group"><div class="se-group-label">${escHtml(group)}</div>`;
    items.forEach((item, i) => {
      html += `<div class="se-row">
        <input value="${escHtml(item.label)}" data-group="${escHtml(group)}" data-idx="${i}" data-field="label" placeholder="标签">
        <textarea data-group="${escHtml(group)}" data-idx="${i}" data-field="text" placeholder="动作描述">${escHtml(item.text)}</textarea>
        <button class="se-del" onclick="deleteSnippetItem('${escHtml(group)}',${i})">×</button>
      </div>`;
    });
    html += `<div class="se-add"><button onclick="addSnippetItem('${escHtml(group)}')">+ 添加</button></div></div>`;
  }
  container.innerHTML = html;
  document.getElementById('snippet-editor-overlay').classList.add('open');
}
function closeSnippetEditor() {
  const rows = document.querySelectorAll('#snippet-editor-groups .se-row');
  const newSnippets = {};
  rows.forEach(row => {
    const labelInp = row.querySelector('[data-field="label"]');
    const textInp = row.querySelector('[data-field="text"]');
    if (!labelInp || !textInp) return;
    const group = labelInp.dataset.group;
    const label = labelInp.value.trim();
    const text = textInp.value.trim();
    if (!label && !text) return;
    if (!newSnippets[group]) newSnippets[group] = [];
    newSnippets[group].push({ label: label || text.slice(0, 20), text });
  });
  for (const group of Object.keys(i2vSnippets)) {
    if (!newSnippets[group]) newSnippets[group] = [];
  }
  i2vSnippets = newSnippets;
  if (i2vSnippets['✏️ 自定义'] !== undefined && Object.keys(i2vSnippets)[0] !== '✏️ 自定义') {
    const custom = i2vSnippets['✏️ 自定义'];
    delete i2vSnippets['✏️ 自定义'];
    i2vSnippets = { '✏️ 自定义': custom, ...i2vSnippets };
  }
  saveI2VSnippets();
  document.getElementById('snippet-editor-overlay').classList.remove('open');
}
function cancelSnippetEditor() {
  i2vSnippets = _editorSnapshot;
  document.getElementById('snippet-editor-overlay').classList.remove('open');
}
function deleteSnippetItem(group, idx) {
  if (i2vSnippets[group]) i2vSnippets[group].splice(idx, 1);
  saveI2VSnippets();
  openSnippetEditor();
}
function addSnippetItem(group) {
  if (!i2vSnippets[group]) i2vSnippets[group] = [];
  i2vSnippets[group].push({ label: '', text: '' });
  saveI2VSnippets();
  openSnippetEditor();
}
loadI2VSnippets();

(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = saved === 'light' ? '🌙' : '☀️';
})();
window.toggleTheme = function() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = next === 'light' ? '🌙' : '☀️';
};
